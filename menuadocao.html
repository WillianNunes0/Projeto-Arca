<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Arca - Painel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
<!-- NAVBAR PRINCIPAL -->
<!-- NAVBAR -->
<nav class="navbar-arca">

    <div class="container">

        <div class="navbar-wrapper">

            <!-- ESQUERDA -->
            <div class="nav-side">

                <button class="nav-link active"
                        id="tab-inicio"
                        data-bs-toggle="tab"
                        data-bs-target="#conteudo-inicio"
                        type="button">

                    <i class="bi bi-house">Início</i>
                    

                </button>

                <button class="nav-link"
                        id="tab-adocao"
                        data-bs-toggle="tab"
                        data-bs-target="#conteudo-adocao"
                        type="button">

                    <i class="bi bi-dog">Adoção</i>
                    

                </button>

            </div>

            <!-- LOGO -->
            <a href="#" class="logo-center">

                <img src="./Imagens/Logos/logo-arca.png"
                     alt="Logo Arca"
                     class="logo-arca"
                     >

            </a>

            <!-- DIREITA -->
            <div class="nav-side">

                <button class="nav-link"
                        id="tab-resgate"
                        data-bs-toggle="tab"
                        data-bs-target="#conteudo-resgate"
                        type="button">

                    <i class="bi bi-ambulance">Resgate</i>
                    

                </button>

                <button class="nav-link"
                        id="tab-castracao"
                        data-bs-toggle="tab"
                        data-bs-target="#conteudo-castracao"
                        type="button">

                    <i class="bi bi-heart-pulse">Castração</i>
                    

                </button>

            </div>

        </div>

    </div>

</nav>
</body>
</html>
