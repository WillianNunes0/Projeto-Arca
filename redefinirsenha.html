<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Arca - Redefinir Senha</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR IDENTIDADE VISUAL -->
    <nav class="navbar-arca">
        <div class="container-fluid px-5">
            <div class="navbar-wrapper d-flex justify-content-center">
                <a href="index.html" class="logo-center">
                    <img src="./Imagens/Logos/logo-arca.png" alt="Logo Arca" class="logo-arca">
                </a>
            </div>
        </div>
    </nav>

    <section class="login-section">
        <div class="container d-flex align-items-center justify-content-center p-3">
            <div class="col-10 col-sm-8 col-md-6 col-lg-4">
                <div class="card card-login p-4">
                    <form id="formulario" novalidate action="index.html">
                        <div class="mb-3">
                            <label for="email" class="form-label">Digite seu email</label>
                            <input type="email" class="form-control" id="email" placeholder="seuemail@exemplo.com" required>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="novaSenha" class="form-label">Nova senha</label>
                            <input type="password" class="form-control" id="novaSenha" required>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmarSenha" class="form-label">Confirmar nova senha</label>
                            <input type="password" class="form-control" id="confirmarSenha" required>
                            <div class="invalid-feedback"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Redefinir Senha</button>
                    </form>
                </div>
                <div class="mt-1 ms-1 esqueceu-senha">
                    <a href="index.html">Voltar para login</a>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
