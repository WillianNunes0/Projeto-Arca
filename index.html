<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Projeto Arca</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <nav class="nav justify-content-center">
            <a class="navbar-brand" href="#">
                <img src="./Imagens/Logos/logo-arca.png" width="300"
                    height="125" alt="Logo Arca">
            </a>
        </nav>

        <section class="login">
            <div
                class="login d-flex align-items-center justify-content-center p-3">
                <div class="col-10 col-sm-8 col-md-6 col-lg-4">
                    <div class="card card-login p-4">
                        <form id="formulario" novalidate action="index.html">
                            <div class="mb-3">
                                <label for="email"
                                    class="form-label">Email</label>
                                <!-- data-error guarda a mensagem / required ativa a validação -->
                                <input type="text" class="form-control"
                                    id="email"
                                    data-error="insira um e-mail válido."
                                    required>
                                <!-- Esta div receberá o erro do JS -->
                                <div
                                    class="error-message invalid-feedback"></div>
                            </div>
                            <div class="mb-3">
                                <label for="password"
                                    class="form-label">Senha</label>
                                <input type="password" class="form-control"
                                    id="senha"
                                    data-error="A senha é obrigatória para o login."
                                    required>
                                <div
                                    class="error-message invalid-feedback"></div>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input"
                                    id="manterConectado">
                                <label class="form-check-label"
                                    for="manterConectado">Manter
                                    Conectado</label>
                            </div>
                            <div class="mb-3 text-center">
                                <a href="cadastro.html">Registre-se</a>
                            </div>
                            <button type="submit"
                                class="btn btn-primary w-100">Login</button>
                        </form>
                    </div>
                    <div class="ms-2 mt-1 esqueceu-senha">
                        <a href="redefinirsenha.html">Esqueceu a senha?</a>
                    </div>
                </div>
            </div>
        </section>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="./script.js"></script>
    </body>
</html>
