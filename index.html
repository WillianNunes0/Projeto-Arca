<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Arca - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar-arca">
        <div class="container">
            <div class="navbar-wrapper d-flex justify-content-center">
                <a href="index.html" class="logo-center">
                    <img src="./Imagens/Logos/logo-arca.png" alt="Logo Arca" class="logo-arca">
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTEÚDO DE LOGIN -->
    <section class="login-section">
        <div class="container d-flex align-items-center justify-content-center p-3">
            <div class="col-10 col-sm-8 col-md-6 col-lg-4">
                <div class="card card-login p-4">
                    <form id="formulario" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" 
                                   data-error="Insira um e-mail válido." required>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senha" 
                                   data-error="A senha é obrigatória." required>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="manterConectado">
                            <label class="form-check-label" for="manterConectado">Manter Conectado</label>
                        </div>

                        <div class="mb-3 text-center">
                            <a href="cadastro.html">Registre-se</a>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                </div>
                <div class="ms-2 mt-1 esqueceu-senha">
                    <a href="redefinirsenha.html">Esqueceu a senha?</a>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
