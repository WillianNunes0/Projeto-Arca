<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Arca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="nav justify-content-center">
  <a class="navbar-brand" href="#">
    <img src="./imagens/logo-arca.png" width="300" height="150">
  </a>
</nav>

<section class="login w-100">
    <div class="container d-flex justify-content-center">
        <div class="col-10 col-sm-8 col-md-6 col-lg-4">
            <div class="card card-login p-4">
                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password">
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="manterConectado">
                        <label class="form-check-label" for="manterConectado">
                            Manter Conectado
                        </label>
                    </div>

                    <div class="mb-3 text-center">
                        <a href="#">Registre-se</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Login
                    </button>
                </form> 
            </div>
        </div>
    </div>
</section>   

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
